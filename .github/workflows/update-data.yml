name: Update stock prices

on:
  schedule:
    # 5:00pm ET, weekdays. Cron runs in UTC and doesn't know about daylight
    # saving, so there's one line for each offset. scripts/should_run_today.py
    # drops the one that doesn't match today, plus weekends and NYSE holidays.
    - cron: "0 21 * * 1-5"   # 5pm EDT (Mar-Nov)
    - cron: "0 22 * * 1-5"   # 5pm EST (Nov-Mar)

  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    # The very first run backfills full history for every ticker in the
    # universe (potentially thousands), which takes far longer than the
    # day-to-day incremental runs after that.
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Skip holidays and the off-season cron
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: echo "run=$(python scripts/should_run_today.py)" >> "$GITHUB_OUTPUT"

      - name: Make sure the ticker universe exists
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f data/universe.json ]; then
            echo "data/universe.json is missing. Run the 'Update ticker universe' workflow first."
            exit 1
          fi

      - name: Fetch latest prices
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_prices.py

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Price Bot"
          git config user.email "pricebot@vtsax-tracker.local"
          git add data/prices data/last_updated.json
          git commit -m "Update prices ($(TZ=America/Detroit date +'%Y-%m-%d %H:%M %Z'))"
          git push
