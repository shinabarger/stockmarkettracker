<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VTSAX Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --positive: #15803d;
    --positive-bg: #dcfce7;
    --negative: #1d4ed8;
    --negative-bg: #dbeafe;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }

  header .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  header .today-date {
    margin: 2px 0 24px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .headline-card .headline {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.4;
  }

  .headline .positive { color: var(--positive); }
  .headline .negative { color: var(--negative); }

  .summary-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  /* Percent change goes on the left: it's the number people care about most. */
  .change-block {
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--border);
  }

  .change-block.positive {
    background: var(--positive-bg);
    color: var(--positive);
  }

  .change-block.negative {
    background: var(--negative-bg);
    color: var(--negative);
  }

  .change-block .change-percent {
    display: block;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .change-block .change-amount {
    display: block;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .change-block .change-label {
    display: block;
    font-size: 0.75rem;
    opacity: 0.85;
    margin-top: 2px;
  }

  .value-block {
    text-align: right;
  }

  .value-block .label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .value-block .value {
    display: block;
    font-size: 2.25rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .value-block .updated,
  .value-block .reference-value {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .range-toggle {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .toggle-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }

  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .toggle-btn input[type="number"] {
    width: 46px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 4px;
    font-size: 0.85rem;
    color: var(--text);
  }

  .chart-card {
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chart-error {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin: 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 8px;
  }

  footer a {
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>VTSAX Tracker</h1>
      <p class="subtitle">Vanguard Total Stock Market Index Fund &mdash; Admiral Shares</p>
      <p class="today-date" id="today-date">&nbsp;</p>
    </header>

    <section class="card headline-card">
      <p class="headline" id="headline">Loading&hellip;</p>
    </section>

    <section class="card summary-card">
      <div class="change-block" id="change-block">
        <span class="change-percent" id="change-percent">&mdash;</span>
        <span class="change-amount" id="change-amount">&nbsp;</span>
        <span class="change-label" id="change-label">&mdash;</span>
      </div>
      <div class="value-block">
        <span class="label">Current Value</span>
        <span id="current-price" class="value">Loading&hellip;</span>
        <span id="last-updated" class="updated">&nbsp;</span>
        <span id="reference-value" class="reference-value">&nbsp;</span>
      </div>
    </section>

    <section class="card">
      <div class="range-toggle" id="range-toggle">
        <button class="toggle-btn active" data-range="mtd">Month to Date</button>
        <button class="toggle-btn" data-range="ytd">Year to Date</button>
        <button class="toggle-btn" data-range="1y">Past Year</button>
        <div class="toggle-btn" data-range="ny" id="ny-toggle">
          Past <input type="number" id="years-input" min="1" max="50" value="5" /> Years
        </div>
      </div>
    </section>

    <section class="card chart-card">
      <canvas id="price-chart"></canvas>
    </section>

    <footer>
      <p>
        Data source: Yahoo Finance, fetched automatically by a scheduled GitHub Action
        after each business day's market close. This is not financial advice.
      </p>
    </footer>
  </div>

<script>
  const DATA_URL = "data/vtsax_history.json";

  // Colors are pulled from CSS variables so the chart line always matches
  // the badge colors used elsewhere on the page.
  const POSITIVE_COLOR = "#15803d";
  const NEGATIVE_COLOR = "#1d4ed8";
  const BASELINE_COLOR = "#a855f7"; // dashed reference line marking the starting value
  const BASELINE_LABEL = "Starting value";

  let history = [];      // [{ date: "YYYY-MM-DD", close: number }, ...] sorted ascending
  let currentRange = "mtd";
  let chart = null;

  async function loadHistory() {
    try {
      const response = await fetch(DATA_URL, { cache: "no-store" });
      history = await response.json();
    } catch (err) {
      history = [];
    }
    render();
  }

  function parseDate(dateStr) {
    return new Date(dateStr + "T00:00:00");
  }

  function formatCurrency(value) {
    return "$" + value.toFixed(2);
  }

  // Same as formatCurrency, but always shows a +/- sign. Used for dollar
  // changes, where the sign carries meaning.
  function formatSignedCurrency(value) {
    const sign = value >= 0 ? "+" : "-";
    return `${sign}$${Math.abs(value).toFixed(2)}`;
  }

  function formatPercent(value) {
    const sign = value >= 0 ? "+" : "";
    return `${sign}${value.toFixed(2)}%`;
  }

  function formatDisplayDate(dateStr) {
    return parseDate(dateStr).toLocaleDateString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
    });
  }

  function getYearsInputValue() {
    const raw = parseInt(document.getElementById("years-input").value, 10);
    return Number.isNaN(raw) || raw < 1 ? 1 : raw;
  }

  // Index of the last trading day strictly before cutoffDate.
  function lastIndexBefore(cutoffDate) {
    let found = -1;
    for (let i = 0; i < history.length; i++) {
      if (parseDate(history[i].date) < cutoffDate) {
        found = i;
      } else {
        break;
      }
    }
    return found;
  }

  // Index of the first trading day on or after cutoffDate.
  function firstIndexOnOrAfter(cutoffDate) {
    for (let i = 0; i < history.length; i++) {
      if (parseDate(history[i].date) >= cutoffDate) {
        return i;
      }
    }
    return history.length - 1;
  }

  // Returns the index into `history` to use as the comparison point for the
  // currently selected range, or -1 if there isn't enough history yet.
  function findReferenceIndex(range) {
    if (history.length === 0) return -1;

    const lastDate = parseDate(history[history.length - 1].date);

    if (range === "mtd") {
      const startOfThisMonth = new Date(lastDate.getFullYear(), lastDate.getMonth(), 1);
      return lastIndexBefore(startOfThisMonth);
    }

    if (range === "ytd") {
      const startOfThisYear = new Date(lastDate.getFullYear(), 0, 1);
      return lastIndexBefore(startOfThisYear);
    }

    if (range === "1y") {
      const oneYearAgo = new Date(lastDate);
      oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
      return firstIndexOnOrAfter(oneYearAgo);
    }

    if (range === "ny") {
      const years = getYearsInputValue();
      const nYearsAgo = new Date(lastDate);
      nYearsAgo.setFullYear(nYearsAgo.getFullYear() - years);
      return firstIndexOnOrAfter(nYearsAgo);
    }

    return -1;
  }

  // Returns { current, reference, dollarChange, percentChange } for the
  // given reference index, or null if there isn't a valid reference point.
  function computeChange(referenceIndex) {
    if (referenceIndex < 0 || referenceIndex >= history.length) return null;

    const current = history[history.length - 1].close;
    const reference = history[referenceIndex].close;
    const dollarChange = current - reference;
    const percentChange = (dollarChange / reference) * 100;

    return { current, reference, dollarChange, percentChange };
  }

  function buildHeadlineText(change, referenceDateStr) {
    const direction = change.percentChange >= 0 ? "increased" : "decreased";
    const directionClass = change.percentChange >= 0 ? "positive" : "negative";
    const dollarAmount = formatCurrency(Math.abs(change.dollarChange));
    const percentAmount = Math.abs(change.percentChange).toFixed(2);

    return (
      `Since ${formatDisplayDate(referenceDateStr)}, VTSAX has ` +
      `<span class="${directionClass}">${direction}</span> by ${dollarAmount} ` +
      `by ${percentAmount}%.`
    );
  }

  function renderTodayDate() {
    const today = new Date().toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric",
    });
    document.getElementById("today-date").textContent = `Today: ${today}`;
  }

  function renderHeadline(change, referenceIndex) {
    const headlineEl = document.getElementById("headline");

    if (!change) {
      headlineEl.textContent = "Not enough history yet to show a comparison.";
      return;
    }

    headlineEl.innerHTML = buildHeadlineText(change, history[referenceIndex].date);
  }

  function renderSummary(change, referenceIndex) {
    const last = history[history.length - 1];
    document.getElementById("current-price").textContent = formatCurrency(last.close);
    document.getElementById("last-updated").textContent = `As of ${formatDisplayDate(last.date)}`;

    const changeBlock = document.getElementById("change-block");
    const percentEl = document.getElementById("change-percent");
    const amountEl = document.getElementById("change-amount");
    const labelEl = document.getElementById("change-label");
    const referenceEl = document.getElementById("reference-value");

    changeBlock.classList.remove("positive", "negative");

    if (change) {
      const reference = history[referenceIndex];
      percentEl.textContent = formatPercent(change.percentChange);
      amountEl.textContent = formatSignedCurrency(change.dollarChange);
      labelEl.textContent = `since ${formatDisplayDate(reference.date)}`;
      referenceEl.textContent = `Previous: ${formatCurrency(reference.close)} (${formatDisplayDate(reference.date)})`;
      changeBlock.classList.add(change.percentChange >= 0 ? "positive" : "negative");
    } else {
      percentEl.textContent = "—";
      amountEl.textContent = "";
      labelEl.textContent = "Not enough history yet";
      referenceEl.textContent = "";
    }
  }

  function showChartError(message) {
    const canvas = document.getElementById("price-chart");
    canvas.replaceWith(Object.assign(document.createElement("p"), {
      className: "chart-error",
      textContent: message,
    }));
  }

  function renderChart(referenceIndex, isPositive) {
    if (typeof Chart === "undefined") {
      showChartError("Chart failed to load (the charting library didn't reach the browser). Check your ad blocker or network settings and reload.");
      return;
    }

    const startIndex = Math.max(referenceIndex, 0);
    const slice = history.slice(startIndex);

    const labels = slice.map((point) => point.date);
    const values = slice.map((point) => point.close);
    const lineColor = isPositive ? POSITIVE_COLOR : NEGATIVE_COLOR;

    // A flat dashed line at the starting value, so it's easy to see at a
    // glance how far the price has moved from where the period began.
    const startingValue = values[0];
    const baselineValues = values.map(() => startingValue);

    try {
      if (chart) {
        chart.destroy();
      }

      chart = new Chart(document.getElementById("price-chart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: BASELINE_LABEL,
              data: baselineValues,
              borderColor: BASELINE_COLOR,
              borderDash: [6, 4],
              borderWidth: 1.5,
              pointRadius: 0,
              fill: false,
            },
            {
              label: "VTSAX",
              data: values,
              borderColor: lineColor,
              backgroundColor: lineColor + "14", // faint fill, same hue as the line
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 4,
              fill: true,
              tension: 0.15,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          // Lets the tooltip follow the mouse horizontally without needing to
          // land exactly on a data point, standard behavior for stock charts.
          interaction: { mode: "index", intersect: false },
          scales: {
            x: { ticks: { maxTicksLimit: 8 } },
            y: { ticks: { callback: (v) => "$" + v.toFixed(0) } },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              // The baseline is just a visual reference, not something worth
              // a tooltip row of its own.
              filter: (item) => item.dataset.label !== BASELINE_LABEL,
              callbacks: {
                title: (items) => formatDisplayDate(items[0].label),
                label: (item) => formatCurrency(item.parsed.y),
              },
            },
          },
        },
      });
    } catch (err) {
      console.error("Chart rendering failed:", err);
      showChartError("Something went wrong drawing the chart. Check the browser console for details.");
    }
  }

  function render() {
    renderTodayDate();

    if (history.length === 0) {
      document.getElementById("headline").textContent = "Waiting for the first scheduled update.";
      document.getElementById("current-price").textContent = "No data yet";
      document.getElementById("last-updated").textContent = "";
      return;
    }

    const referenceIndex = findReferenceIndex(currentRange);
    const change = computeChange(referenceIndex);

    renderHeadline(change, referenceIndex);
    renderSummary(change, referenceIndex);
    renderChart(referenceIndex, !change || change.percentChange >= 0);
  }

  function selectRange(range) {
    currentRange = range;
    document.querySelectorAll("[data-range]").forEach((el) => {
      el.classList.toggle("active", el.dataset.range === range);
    });
    render();
  }

  document.querySelectorAll("[data-range]").forEach((el) => {
    el.addEventListener("click", () => selectRange(el.dataset.range));
  });

  document.getElementById("years-input").addEventListener("input", () => selectRange("ny"));
  document.getElementById("years-input").addEventListener("click", (e) => e.stopPropagation());

  loadHistory();
</script>
</body>
</html>
