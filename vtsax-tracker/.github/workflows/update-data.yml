name: Update VTSAX data

on:
  schedule:
    # Mutual fund NAVs post after the 4pm ET market close, usually by ~6-7pm ET.
    # Cron runs in UTC and doesn't know about daylight saving, so each ET time
    # below needs two lines (EDT = UTC-4, EST = UTC-5).

    # ~6:30pm ET, weekdays
    - cron: "30 22 * * 1-5"   # EDT (Mar-Nov)
    - cron: "30 23 * * 1-5"   # EST (Nov-Mar)

    # Backup run ~9:30pm ET in case a NAV posted late. Runs land on the
    # following UTC calendar day, so the weekday range shifts by one.
    - cron: "30 1 * * 2-6"    # EDT (Mar-Nov)
    - cron: "30 2 * * 2-6"    # EST (Nov-Mar)

  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest VTSAX price
        run: python scripts/update_vtsax_data.py

      - name: Commit updated data if it changed
        run: |
          if git diff --quiet -- data/vtsax_history.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vtsax_history.json
          git commit -m "Update VTSAX data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
